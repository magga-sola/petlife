<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Start Page</title>
    <link rel="stylesheet" href="./start_page.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main>
      <div class="container">
        <div class="center_point">
          <div class="stickers_right_side">
          <img id="star_stickers" src="images/website/stars.png">
        </div>
        <div class="title_box">
          <img id="paper_container" src="images/website/paper.png">
          <div class="title_text">
            <h1>Sorry,</h1>
            <h2>website isn't ready yet</h2>
            <div class="normal_text">
              <p>Thanks for stopping by.</p>
              <p>In the meantime here's a picture of my dog: Anya </p>
            </div>
          </div>
        </div>
        <div class="stickers_left_side">
          <img id="patch_sticker" src="images/website/patch1.png">
        </div>
        <div class="dog_box">
          <img id="poloroid_frame" src="images/website/poloroid.png" alt="a picture of my black labrador: Anya">
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
